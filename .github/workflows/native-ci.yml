name: Native (Swift) CI

# Build + test only. Releases are signed on the maintainer's Mac (no Apple
# Developer Program), so nothing here needs a secret.

on:
  push:
    branches: [main]
    paths:
      - "EasyDockApp/**"
      - "EasyDockAppTests/**"
      - "EasyDockCore/**"
      - "EasyDock.xcodeproj/**"
      - ".github/workflows/native-ci.yml"
  pull_request:
    paths:
      - "EasyDockApp/**"
      - "EasyDockAppTests/**"
      - "EasyDockCore/**"
      - "EasyDock.xcodeproj/**"
      - ".github/workflows/native-ci.yml"

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select latest available Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Using $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: Test EasyDockCore (headless package)
        working-directory: EasyDockCore
        run: swift test

      # Local.xcconfig is gitignored (per-machine signing identity); the
      # example is ad-hoc, which is all a compile check needs.
      - name: Create Local.xcconfig
        run: cp Local.xcconfig.example Local.xcconfig

      - name: Build EasyDockApp
        run: |
          xcodebuild -project EasyDock.xcodeproj -scheme EasyDockApp -configuration Debug build \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
